<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BDG Interactions Fixture</title>
  </head>
  <body>
    <form id="form">
      <input id="name" name="name" type="text" />
      <textarea id="notes" name="notes"></textarea>
      <input id="agree" name="agree" type="checkbox" />
      <input id="locked" name="locked" type="text" value="locked" readonly />
      <input id="off" name="off" type="text" value="off" disabled />
      <input id="upload" name="upload" type="file" />
      <button id="submit" type="submit">Send</button>
    </form>
    <div id="editor" contenteditable="true"></div>
    <div id="menu-trigger" tabindex="0">Menu</div>
    <div id="menu" hidden>Opened</div>
    <button id="load" type="button">Load</button>
    <button id="load-delayed" type="button" onclick="fetch('/api/delayed')">Load slowly</button>
    <button id="navigate-slow" type="button" onclick="location.href = '/slow'">
      Open slow page
    </button>

    <script>
      // Event log for assertions: "<id>:<type>[:<key>]"
      window.events = [];
      window.submits = 0;
      const log = (e) => window.events.push(`${e.target.id}:${e.type}${e.key ? ':' + e.key : ''}`);
      for (const id of ['name', 'notes', 'agree', 'editor']) {
        const el = document.getElementById(id);
        for (const type of [
          'keydown',
          'keypress',
          'input',
          'change',
          'click',
          'blur',
          'focusout',
        ]) {
          el.addEventListener(type, log);
        }
      }

      document.getElementById('form').addEventListener('submit', (e) => {
        e.preventDefault();
        window.submits++;
      });

      // React-style controlled checkbox: state changes only on click, and the
      // DOM is re-rendered from state after every change (like a React commit).
      const agree = document.getElementById('agree');
      window.agreeState = false;
      agree.addEventListener('click', () => {
        window.agreeState = !window.agreeState;
      });
      agree.addEventListener('change', () => {
        setTimeout(() => {
          agree.checked = window.agreeState;
        }, 0);
      });

      // Loads data from the fixture API (triggered-request reporting)
      document.getElementById('load').addEventListener('click', () => {
        void fetch('/api/test', { method: 'POST', body: '{}' });
      });

      // Radix/MUI-style menu: opens on pointerdown, not on click
      document.getElementById('menu-trigger').addEventListener('pointerdown', () => {
        document.getElementById('menu').hidden = false;
      });
    </script>
  </body>
</html>
