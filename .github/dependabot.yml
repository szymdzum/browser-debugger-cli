version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Types must match the minimum supported Node (package.json engines)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TypeScript 7 yet (peer typescript <6.1)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Parser and plugin are released together and must match
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Every codeql-action step in a workflow must run the same version
      codeql-action:
        patterns:
          - "github/codeql-action*"
