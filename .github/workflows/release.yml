name: Release

# Publishes a tagged version to npm with npm Trusted Publishing (OIDC):
# no npm token and no one-time password. The version bump and CHANGELOG are
# done in a pull request first (see docs/RELEASE_PROCESS.md); publishing the
# GitHub release for its tag starts this workflow. It can also be run by hand
# for an existing tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.8.0'
        required: true
        type: string

permissions:
  contents: read
  actions: read # read the CI runs of the tagged commit
  id-token: write # OIDC token for npm Trusted Publishing (and provenance)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm 11.5.1 or newer (Node 22 ships npm 10)
      - name: Update npm
        run: npm install -g npm@11

      - name: Check tag matches package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          GREEN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
            --json conclusion,event \
            --jq '[.[] | select(.event=="push" and .conclusion=="success")] | length')"
          if [[ "$GREEN" -eq 0 ]]; then
            echo "::error::No successful CI run on main for $SHA"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check:enhanced

      - name: Run contract tests
        run: npm test

      - name: Build package
        run: npm run build

      # Prereleases go to the "next" dist-tag so `npm install browser-debugger-cli`
      # keeps resolving to the latest stable version.
      - name: Publish to npm
        run: |
          if [[ "$VERSION" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
