name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version increment type'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - prerelease     # 0.0.1-alpha.0 -> 0.0.1-alpha.1
          - prepatch       # 0.0.1-alpha.0 -> 0.0.2-alpha.0
          - preminor       # 0.0.1-alpha.0 -> 0.1.0-alpha.0
          - premajor       # 0.0.1-alpha.0 -> 1.0.0-alpha.0
          - patch          # 0.0.1-alpha.0 -> 0.0.1 (stable)
          - minor          # 0.0.1-alpha.0 -> 0.1.0 (stable)
          - major          # 0.0.1-alpha.0 -> 1.0.0 (stable)
      prerelease_id:
        description: 'Prerelease identifier (alpha, beta, rc)'
        required: false
        default: 'alpha'
        type: string

permissions:
  contents: write # push the version commit and tag, create the GitHub release

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # Releases are cut from main only (the job pushes the version bump to main)
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check:enhanced

      - name: Run contract tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Bump version
        id: version
        run: |
          if [[ "${{ inputs.version_type }}" == pre* ]]; then
            npm version ${{ inputs.version_type }} --preid=${{ inputs.prerelease_id }}
          else
            npm version ${{ inputs.version_type }}
          fi
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Push version bump
        run: |
          git push origin main
          git push origin v${{ steps.version.outputs.version }}

      # Prereleases go to the "next" dist-tag so `npm install browser-debugger-cli`
      # keeps resolving to the latest stable version.
      - name: Publish to npm
        run: |
          if [[ "${{ steps.version.outputs.version }}" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE_FLAG="--prerelease"; fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            $PRERELEASE_FLAG \
            --notes "$(printf '## Installation\n\n```bash\nnpm install -g browser-debugger-cli@%s\n```\n' "$VERSION")"
