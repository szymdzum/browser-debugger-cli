name: Release

# Publishes a tagged version to npm with npm Trusted Publishing (OIDC):
# no npm token and no one-time password. The version bump and CHANGELOG are
# done in a pull request first (see docs/RELEASE_PROCESS.md); publishing the
# GitHub release for its tag starts this workflow. It can also be run by hand
# for an existing tag, optionally as a dry run that publishes nothing.
#
# Two jobs: "build" installs, checks, tests and packs the tarball, and holds no
# OIDC permission, so a compromised devDependency cannot publish. "publish"
# holds id-token: write, runs no project code and only publishes the tarball
# that "build" produced (its sha512 is checked first).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.8.0'
        required: true
        type: string
      dry_run:
        description: 'Run npm publish --dry-run: nothing is published'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read the CI runs of the tagged commit
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha512: ${{ steps.pack.outputs.sha512 }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check tag matches package.json
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Only the CI OK job counts: the security audit and macOS smoke are
      # report-only and must not block a release.
      - name: Check CI OK passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --event push --json databaseId --jq '.[].databaseId'); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --paginate --jq '.jobs[] | select(.name=="CI OK" and .conclusion=="success") | .id'
          done | grep -q . || { echo "::error::CI OK has not passed on a push to main for $SHA. If CI is still running, wait and re-run this workflow (workflow_dispatch with the tag)."; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check:enhanced

      - name: Run contract tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Pack tarball
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          TARBALL="$(npm pack --pack-destination "$RUNNER_TEMP/pack" --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename")"
          SHA512="$(sha512sum "$RUNNER_TEMP/pack/$TARBALL" | cut -d' ' -f1)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha512=$SHA512" >> "$GITHUB_OUTPUT"
          echo "Packed $TARBALL (sha512 $SHA512)"

      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # OIDC token for npm Trusted Publishing (and provenance)
    env:
      TARBALL: ${{ needs.build.outputs.tarball }}
      EXPECTED_SHA512: ${{ needs.build.outputs.sha512 }}
      VERSION: ${{ needs.build.outputs.version }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm 11.5.1 or newer (Node 22 ships npm 10)
      - name: Update npm
        run: npm install -g npm@11.21.0

      - name: Download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/tarball

      - name: Verify tarball checksum
        run: |
          ACTUAL="$(sha512sum "$RUNNER_TEMP/tarball/$TARBALL" | cut -d' ' -f1)"
          if [[ "$ACTUAL" != "$EXPECTED_SHA512" ]]; then
            echo "::error::sha512 of $TARBALL ($ACTUAL) does not match the build job ($EXPECTED_SHA512)"
            exit 1
          fi
          echo "sha512 matches the build job: $ACTUAL"

      # Prereleases go to the "next" dist-tag so `npm install browser-debugger-cli`
      # keeps resolving to the latest stable version. A release event is never a
      # dry run. A tarball publish runs no lifecycle scripts; --ignore-scripts
      # makes that explicit.
      - name: Publish to npm
        run: |
          ARGS=(--provenance --access public --ignore-scripts)
          if [[ "$VERSION" == *-* ]]; then ARGS+=(--tag next); fi
          if [[ "$DRY_RUN" == "true" ]]; then ARGS+=(--dry-run); fi
          npm publish "$RUNNER_TEMP/tarball/$TARBALL" "${ARGS[@]}"
